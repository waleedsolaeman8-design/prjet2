<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Interactive Profile Card</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <article class="card profile">
      <div class="avatar" aria-hidden="true">AR</div>
      <h1>Alex Rivera</h1>
      <p>Frontend Learner</p>
      <p id="bio-text">Building things for the web.</p>
      <button id="edit-bio-btn">Edit Bio</button>
      <p>Followers: <strong id="follower-count">128</strong></p>
      <button id="follow-button" aria-pressed="false">Follow</button>
      <p>
        <a href="https://github.com/" target="_blank" rel="noopener noreferrer"
          >GitHub</a
        >
        ·
        <a
          href="https://www.linkedin.com/"
          target="_blank"
          rel="noopener noreferrer"
          >LinkedIn</a
        >
      </p>
    </article>
  </body>
</html>
