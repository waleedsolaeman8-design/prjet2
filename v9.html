<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <p>heloo word </p><!--هو عبارة عن بلك كل جملة بكتبها بسطر لحالها -->
    <span>heloo word</span><!--هاض لا مش بلك بكتب الجمل جنب بعض ما بحطها بسطر لحالها-->
    <p>heloo <small>word</small></p><!--هاض الامر الي هو تصغير الخط ان لاين بقدر استخدمه داخل الجملة زي هيك -->
    <h3>macbook m2</h3>
    <p>price <b>1300</b></p><!--هاي بتخلي الخط غامق وعريض يعني للزينة -->
    <p>price <strong>1300</strong></p><!--هاي شو بتفرق عن الي فوق نفس الاشي بس هاي بستخدمها مع الكلمات المهمة يعني مش للزينة بس -->
    <p>price <i>1300</i></p><!--هاي بتخلي الكلام مايل -->
    <p>price<em>1300</em></p><!--هاي بتخلي الخط مايل برضو بس بستخدمها مع المقالات -->
    <p>price<mark>1300</mark></p><!--هاي بتظلل الكلمة -->
    <p>price<u>1300</u></p><!--هاي بتحطلي خط تحت الكلمة -->
    <p>price<del>1300</del></p><!--هاي بتحط شرطة بنص الكلام كانخات تحذف اللكمة -->
    <p>price<sub>1300</sub></p><!--بتنزل اللمة لتحت السطر -->
    <p>price<sup>1300</sup></p><!--بترفع الكلمة عتن السطر -->
    
</body>
</html>
