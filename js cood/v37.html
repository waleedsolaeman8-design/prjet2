<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div style="text-align: center;">
        <input type="text" id="text1">
        <button id="submtt">submtt</button>
        <h3 id="char"></h3>
    </div>
</body>
<script>
document.getElementById("submtt").addEventListener("click" , function(){
var text2 = document.getElementById("text1").value
for (var x of text2){
    document.getElementById("char").innerHTML += "<h1>"+x+"</h1>"
}
})
</script>
</html>
