<script>
    var str = ""
    var arr = [10, 100, 50 , 40, 90]
    console.log(Array.isArray(arr))//هاي دالة وظيفتها انه اذا بدي اتاكد بجواب ترو او فولس 
    console.log(arr.includes(40))// هاي اذا بدي اشوف عنصر انه موجود عندي في المصفوفة ولا لا 
    arr.shift()//هاي وظيفتها تحذف العنصر من بداية المصفوفة 
    console.log(arr)
    arr.reverse()//هاي وظيفتها بتعكس ترتيب المصفوفة يعني بتخليه ينعكس يبلش من العكس
