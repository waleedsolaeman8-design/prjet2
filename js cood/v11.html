<script>
    var titel = "hello world"
    console.log(titel.toUpperCase())//هاي دالة وظيفتها انه تحول حروف النص عندي الى كبتل 
    console.log(titel.toLowerCase())//هاي دالة برضو شو وظيفتها تحول الحروف عندي الى لور كيسس يعني صغيرة 
    console.log(titel.replace("world" , "waleed"))
    console.log(titel.charAt(0))//هاي وظيفتها انه اطبع الاشي الي حددت رقمه 
    console.log(`hi ${titel}, waleed`)
</script>
