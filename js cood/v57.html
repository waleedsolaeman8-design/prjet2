    <script>
   var arr = ["hello" , "true" , "10" , "20" , "5"]
    function reverseMyArray(arr){
    var newarr = []
    for (var rev =  arr.length-1; rev >= 0 ; rev--){
    newarr.push(arr[rev])
    }
return newarr
    }
