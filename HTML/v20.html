<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <form>
        <div>
            <label for="date">date</label>
            <input id="date" type="date"><!--هون بتحكم بالوقت يعني اليوم والشهر والسنة-->
        </div>
        <div>
            <label for="mon">mon</label>
            <input id="mon" type="month"><!--بتحكم بس بالشهر والسنة-->
        </div>
        <div>
            <label for="all">all</label>
            <input id="all" type="datetime-local"><!--هون بتحكم في كلشي اليوم والشهر والسنة و الوقت يعني كل اشي -->
        </div>
    </form>
</body>
</html>
