<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <form>
        <div>
        <label for="color" >color</label>
        <input id="color" type="color"><!--هاي وظيفتها اني بتخلي المربع بلون -->
        </div>
        <div>
            <label for="fil" >fil</label>
            <input id="fil" type="file"><!--هاي وظيفتها تخليني اختار فايل يعني زي صورة مصلا -->
        </div>
        <div>
            <label for="reng">reng</label>
            <input id="reng" type="range" min="2" max="10" step="3"><!--هاي بتعملي نظام رنج يعني زي شريط انا بتحكم فيه بعلي وبطي زي هيك -->

        </div>
        <div>
            <label for="sr">sr</label>
            <input id="sr" type="search"><!--بتخلي المربع يصير مربع بحث -->
            
        </div>
    </form>
</body>
</html>
